name: Track Stars

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh star history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_star_history.py
      - name: Commit refreshed star history
        run: |
          if git diff --quiet -- data/star-history-snapshots.csv data/star-history-dark.svg data/star-history-light.svg; then
            echo "Star history is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/star-history-snapshots.csv data/star-history-dark.svg data/star-history-light.svg
          git commit -m "chore: refresh star history"
          git push
