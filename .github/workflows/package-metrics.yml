name: Refresh package metrics

on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh package download metrics
        run: python scripts/update_package_stats.py
      - name: Commit refreshed metrics
        run: |
          if git diff --quiet -- data/package-stats.json; then
            echo "Package metrics are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/package-stats.json
          git commit -m "chore: refresh package download metrics"
          git push
