name: Refresh contribution heatmap

on:
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-heatmap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh contribution heatmap
        run: python scripts/update_contribution_heatmap.py
      - name: Commit refreshed heatmap
        run: |
          if git diff --quiet -- data/contribution-heatmap.svg data/contribution-heatmap-light.svg; then
            echo "Contribution heatmaps are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contribution-heatmap.svg data/contribution-heatmap-light.svg
          git commit -m "chore: refresh contribution heatmaps"
          git push
