<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Signal — light profile header</title>
  <desc id="desc">A light aurora header with a rotating medical imaging lens, particles, scan line and glass social chips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#F0FAF7"/>
      <stop offset="1" stop-color="#F6F2FF"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#6D28D9"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0D9488" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#0F766E" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="500" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="500" fill="url(#bg)"/>
    <rect width="1600" height="500" fill="url(#grid)"/>

    <g opacity="0.58">
      <ellipse cx="210" cy="35" rx="310" ry="150" fill="#99F6E4" filter="url(#blur40)">
        <animateTransform attributeName="transform" type="translate" values="0 0;58 -24;0 0" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="920" cy="40" rx="280" ry="130" fill="#DDD6FE" filter="url(#blur40)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-52 30;0 0" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1500" cy="430" rx="340" ry="180" fill="#FDE68A" opacity="0.62" filter="url(#blur40)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 -34;0 0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g fill="#0F766E">
      <circle cx="128" cy="106" r="1.7"><animate attributeName="opacity" values="0.12;0.9;0.12" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="62" r="1.4"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="120" r="1.8"><animate attributeName="opacity" values="0.18;0.9;0.18" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="60" r="1.2"><animate attributeName="opacity" values="0.9;0.12;0.9" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="1470" cy="88" r="1.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1508" cy="310" r="1.2"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4.2s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="Inter, Segoe UI, system-ui, sans-serif">
      <g transform="translate(84 58)">
        <rect width="164" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.82" stroke="#0F766E" stroke-opacity="0.24"/>
        <circle cx="17" cy="15" r="3.5" fill="#0D9488">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="31" y="19.5" fill="#0F766E" font-size="10.5" font-weight="700" letter-spacing="2.1">PROFILE / 2026</text>
      </g>

      <text x="84" y="218" fill="url(#nameGrad)" font-size="92" font-weight="750" letter-spacing="-3.4">GuoFan Zhang</text>
      <text x="88" y="270" fill="#334155" font-size="22" font-weight="400">Medical imaging · AI agents · local-first tools</text>
      <circle cx="586" cy="260" r="2" fill="#0D9488">
        <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <line x1="84" y1="302" x2="640" y2="302" stroke="#0F766E" stroke-opacity="0.18"/>
      <text x="88" y="338" fill="#64748B" font-size="15">I build practical AI systems for research, tools, and knowledge workflows.</text>

      <g>
        <g transform="translate(84 392)">
          <rect width="104" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.84" stroke="#0D9488" stroke-opacity="0.26"/>
          <circle cx="16" cy="16" r="3" fill="#0D9488"/>
          <text x="28" y="20" fill="#334155" font-size="10.5" font-weight="600" letter-spacing="1.4">GITHUB</text>
        </g>
        <g transform="translate(200 392)">
          <rect width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.84" stroke="#7C3AED" stroke-opacity="0.24"/>
          <circle cx="16" cy="16" r="3" fill="#7C3AED"/>
          <text x="28" y="20" fill="#334155" font-size="10.5" font-weight="600" letter-spacing="1.4">NPM</text>
        </g>
        <g transform="translate(296 392)">
          <rect width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.84" stroke="#D97706" stroke-opacity="0.24"/>
          <circle cx="16" cy="16" r="3" fill="#D97706"/>
          <text x="28" y="20" fill="#334155" font-size="10.5" font-weight="600" letter-spacing="1.4">PYPI</text>
        </g>
        <g transform="translate(392 392)">
          <rect width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.84" stroke="#64748B" stroke-opacity="0.22"/>
          <circle cx="16" cy="16" r="3" fill="#64748B"/>
          <text x="28" y="20" fill="#334155" font-size="10.5" font-weight="600" letter-spacing="1.4">BLOG</text>
        </g>
      </g>

      <text x="84" y="462" fill="#64748B" font-size="10.5" font-weight="700" letter-spacing="2.2">SCROLL FOR LIVE DATA ↓</text>
    </g>

    <g transform="translate(1260 250)">
      <circle r="196" fill="#FFFFFF" fill-opacity="0.54" stroke="#0D9488" stroke-opacity="0.14"/>
      <circle r="174" fill="none" stroke="url(#ringGrad)" stroke-opacity="0.42" stroke-width="1.3" stroke-dasharray="2 13">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="142" fill="none" stroke="#7C3AED" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="54 18 7 18">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="108" fill="none" stroke="#0D9488" stroke-opacity="0.26" stroke-width="1"/>
      <circle r="72" fill="none" stroke="#D97706" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="1 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>

      <g stroke="#0D9488" stroke-opacity="0.18">
        <line x1="-216" y1="0" x2="-184" y2="0"/>
        <line x1="184" y1="0" x2="216" y2="0"/>
        <line x1="0" y1="-216" x2="0" y2="-184"/>
        <line x1="0" y1="184" x2="0" y2="216"/>
      </g>
      <g stroke="#0D9488" stroke-opacity="0.1">
        <line x1="-132" y1="-132" x2="-116" y2="-116"/>
        <line x1="132" y1="-132" x2="116" y2="-116"/>
        <line x1="-132" y1="132" x2="-116" y2="116"/>
        <line x1="132" y1="132" x2="116" y2="116"/>
      </g>

      <path d="M-78 14 C-58 -38 -18 -62 18 -43 C54 -24 71 15 43 45 C16 74 -35 77 -58 44 C-68 30 -76 23 -78 14Z" fill="none" stroke="#0F766E" stroke-opacity="0.5" stroke-width="1.4"/>
      <path d="M-58 6 C-44 -28 -10 -42 16 -28 C42 -14 48 14 28 34 C8 54 -28 54 -45 32 C-53 22 -57 14 -58 6Z" fill="none" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1.1" stroke-dasharray="4 6">
        <animate attributeName="stroke-dashoffset" values="0;-40" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M-35 -5 C-22 -22 0 -28 17 -17 C33 -7 35 12 21 25 C8 37 -13 34 -25 21 C-32 13 -36 4 -35 -5Z" fill="none" stroke="#D97706" stroke-opacity="0.38" stroke-width="1"/>

      <g fill="#0D9488">
        <circle cx="0" cy="-156" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="152" cy="0" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
        <circle cx="0" cy="126" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
        <circle cx="-132" cy="0" r="2.5"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
      </g>
      <g fill="#D97706">
        <circle cx="86" cy="-86" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
        <circle cx="-86" cy="86" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      </g>

      <rect x="-172" y="-106" width="344" height="2" fill="url(#scanGrad)" opacity="0.72" filter="url(#blur12)">
        <animate attributeName="y" values="-120;120;-120" dur="6s" repeatCount="indefinite"/>
      </rect>
      <circle r="8" fill="#0D9488" opacity="0.24" filter="url(#blur12)">
        <animate attributeName="r" values="5;13;5" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#0F172A">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="Inter, Segoe UI, system-ui, sans-serif">
      <g transform="translate(1084 92)">
        <rect width="66" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.88" stroke="#0D9488" stroke-opacity="0.24"/>
        <text x="33" y="17" text-anchor="middle" fill="#0F766E" font-size="10" font-weight="700" letter-spacing="1.5">EEG</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5s" repeatCount="indefinite" additive="sum"/>
      </g>
      <g transform="translate(1452 175)">
        <rect width="64" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.88" stroke="#7C3AED" stroke-opacity="0.28"/>
        <text x="32" y="17" text-anchor="middle" fill="#6D28D9" font-size="10" font-weight="700" letter-spacing="1.5">MRI</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="6s" repeatCount="indefinite" additive="sum"/>
      </g>
      <g transform="translate(1420 360)">
        <rect width="64" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.88" stroke="#D97706" stroke-opacity="0.28"/>
        <text x="32" y="17" text-anchor="middle" fill="#B45309" font-size="10" font-weight="700" letter-spacing="1.5">LLM</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.5s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="498" rx="33" fill="none" stroke="#0F172A" stroke-opacity="0.1"/>
</svg>
